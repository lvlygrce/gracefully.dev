<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found &middot; Gracefully</title>
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,200..700;1,6..72,200..700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/style.css" />

  <script>
    try {
      var t = localStorage.getItem("gracefully-theme");
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    } catch (e) { /* stay on light */ }
  </script>

  <style>
    /* Keep the page column width so the left edge lines up with the colophon;
       the lede caps itself at --measure. */
    .page--404 {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .page--404 .lede { margin-top: var(--space-sm); }
    .back {
      display: inline-flex;
      align-items: baseline;
      gap: var(--space-2xs);
      margin-top: var(--space-md);
      font-family: var(--font-meta);
      font-size: var(--size-meta);
      font-weight: 500;
      letter-spacing: var(--tracking-meta);
      text-transform: uppercase;
      color: var(--ink-muted);
      text-decoration: none;
      background-image: linear-gradient(var(--accent), var(--accent));
      background-repeat: no-repeat;
      background-position: 0 100%;
      background-size: 0% 1px;
      transition: background-size var(--dur) var(--ease-expo), color var(--dur) var(--ease);
    }
    .back:hover, .back:focus-visible { color: var(--accent); background-size: 100% 1px; }
    .back__arrow { transition: transform var(--dur) var(--ease-expo); }
    .back:hover .back__arrow { transform: translateX(-4px); }
    @media (prefers-reduced-motion: reduce) {
      .back:hover .back__arrow { transform: none; }
    }
  </style>
</head>
<body>
  <main class="page page--404">
    <p class="masthead__meta reveal reveal--rule" style="--i:0">Error 404</p>
    <h1 class="wordmark reveal reveal--display" style="--i:1">Not found<span class="wordmark__mark">.</span></h1>
    <p class="lede reveal" style="--i:3">
      That page doesn&rsquo;t exist &mdash; <em>gracefully</em>, of course.
    </p>
    <p class="reveal" style="--i:4">
      <a class="back" href="/"><span class="back__arrow" aria-hidden="true">&larr;</span> Back to the index</a>
    </p>
  </main>

  <footer class="colophon reveal" style="--i:5">
    <span>&copy; <span id="year"></span> Grace P</span>
    <a href="https://github.com/lvlygrce" rel="me">github.com/lvlygrce</a>
  </footer>

  <script>
    (function () {
      var els = document.querySelectorAll(".reveal");
      requestAnimationFrame(function () {
        els.forEach(function (el) { el.classList.add("is-in"); });
      });
      document.getElementById("year").textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
