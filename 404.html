<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found &middot; Gracefully</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <style>
    :root { --bg:#fbfaf8; --fg:#1a1a17; --muted:#6b6b63; --accent:#3a7d5c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141513; --fg:#ecebe6; --muted:#9a9a90; --accent:#6cc79b; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
      text-align: center; padding: 1.5rem; line-height: 1.6;
    }
    h1 { font-weight: 300; font-size: clamp(1.75rem, 6vw, 2.5rem); letter-spacing: 0.02em; }
    p { color: var(--muted); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Page not found</h1>
  <p>That page doesn&rsquo;t exist &mdash; gracefully, of course.</p>
  <p><a href="/">Back to Gracefully</a></p>
</body>
</html>
