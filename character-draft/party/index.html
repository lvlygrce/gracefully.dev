<!DOCTYPE html>
<html lang="en" data-theme="light" class="tv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Character Draft party</title>
  <meta name="description" content="Character Draft on the big screen: up to 24 players join on their phones, draft in sealed-bid rounds, then fight it out in a knockout tournament." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/style.css?v=2" />
  <!-- Bump ?v= on every release so browsers drop their cached copies. -->
  <link rel="stylesheet" href="party.css?v=2" />

  <script>
    try {
      var t = localStorage.getItem("theme");
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    } catch (e) { /* blocked storage — stay on light */ }
  </script>
</head>
<body>
  <a class="home-button" href="/" aria-label="Back to Gracefully" title="Back to Gracefully">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3.5 11.2 12 4l8.5 7.2" />
      <path d="M5.8 9.6V19.3c0 .4.3.7.7.7h3.9v-5.4h3.2V20h3.9c.4 0 .7-.3.7-.7V9.6" />
    </svg>
  </a>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.25" />
      <path d="M12 2v2.5M12 19.5V22M4.22 4.22l1.77 1.77M18.01 18.01l1.77 1.77M2 12h2.5M19.5 12H22M4.22 19.78l1.77-1.77M18.01 5.99l1.77-1.77" />
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.5 14.4A8.5 8.5 0 1 1 9.6 3.5a6.8 6.8 0 0 0 10.9 10.9Z" />
    </svg>
  </button>

  <main class="stage" id="app" aria-live="off"></main>
  <p id="announce" class="visually-hidden" aria-live="polite"></p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../characters.js?v=20"></script>
  <script src="../images.js?v=20"></script>
  <script src="../judge.js?v=20"></script>
  <script src="net.js?v=1"></script>
  <script src="tv.js?v=3"></script>
</body>
</html>
