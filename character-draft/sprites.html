<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sprite sheet</title>
  <style>
    :root { --paper: #fbf7ef; --ink: #241f1a; --muted: #6b6257; }
    @media (prefers-color-scheme: dark) { :root { --paper: #17150f; --ink: #efe8da; --muted: #a39a8b; } }
    body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font: 13px/1.3 system-ui, sans-serif; }
    h2 { font-weight: 500; margin: 18px 0 6px; }
    .grid { display: flex; flex-wrap: wrap; gap: 6px; }
    figure { margin: 0; width: 180px; text-align: center; }
    figure canvas { image-rendering: pixelated; width: 176px; height: 176px; background: #cfe3c8; border-radius: 4px; }
    figcaption { color: var(--muted); font-size: 11px; height: 2.6em; overflow: hidden; }
    .poses canvas { width: 120px; height: 120px; }
    select { font: inherit; }
  </style>
</head>
<body>
  <p>World <select id="world"></select> <label><input type="checkbox" id="anim" checked /> animate</label> · pose <select id="pose"></select></p>
  <div id="out"></div>
  <script src="characters.js?v=26"></script>
  <script>document.write('<script src="sprites.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="sprite.js?t=' + Date.now() + '"><\/script>')</script>
  <script>
    const U = window.UNIVERSES;
    const sel = document.getElementById("world"), poseSel = document.getElementById("pose");
    Object.entries(U).forEach(([k, w]) => sel.add(new Option(w.name, k)));
    ["idle", "walk", "windup", "strike", "shoot", "cast", "block", "hurt", "ko", "victory"].forEach(p => poseSel.add(new Option(p, p)));
    const q = new URLSearchParams(location.search);
    if (q.get("world")) sel.value = q.get("world");
    if (q.get("pose")) poseSel.value = q.get("pose");
    let figs = [];
    function show() {
      const w = U[sel.value];
      const out = document.getElementById("out");
      out.innerHTML = `<h2>${w.name} · ${w.characters.length}</h2><div class="grid"></div>`;
      const grid = out.querySelector(".grid");
      figs = w.characters.map(([name, note]) => {
        const sp = Sprite.of({ name, note, world: sel.value });
        const f = document.createElement("figure");
        const c = document.createElement("canvas");
        f.append(c);
        const cap = document.createElement("figcaption");
        cap.textContent = (((window.CHARACTER_SPRITES || {})[sel.value] || {})[name] ? "" : "· ") + name;
        f.append(cap);
        grid.append(f);
        return { sp, c };
      });
      paint(0);
    }
    function paint(t) {
      figs.forEach(({ sp, c }) => {
        const img = sp.frame(poseSel.value, t);
        if (c.width !== img.width) { c.width = img.width; c.height = img.height; }
        const ctx = c.getContext("2d");
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0);
      });
    }
    sel.onchange = show; poseSel.onchange = () => paint(0);
    const t0 = performance.now();
    setInterval(() => { if (document.getElementById("anim").checked) paint(performance.now() - t0); }, 100);
    show();
  </script>
</body>
</html>
