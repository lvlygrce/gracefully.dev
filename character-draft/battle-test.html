<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Battle test</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
  <script>document.write('<link rel="stylesheet" href="battle.css?t=' + Date.now() + '" />')</script>
  <style>
    :root { --paper: #fbf7ef; --ink: #241f1a; }
    body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font: 14px system-ui, sans-serif; }
    #stage { max-width: 960px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <!-- Test page only: keep drawing even when this tab is hidden. -->
  <script>window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 30); window.cancelAnimationFrame = id => clearTimeout(id);</script>
  <script>document.write('<script src="characters.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="sprites.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="sprite.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="battle.js?t=' + Date.now() + '"><\/script>')</script>
  <script>
    const U = window.UNIVERSES;
    const ch = (world, name) => ({ world, name, note: (U[world].characters.find(c => c[0] === name) || [])[1] || "" });
    const teams = [
      { name: "Grace", roster: [ch("marvel", "Thanos"), ch("hp", "Harry Potter"), ch("dc", "Batman"), ch("shows", "Gru"), ch("shows", "Elsa")] },
      { name: "Sam", roster: [ch("marvel", "Spider-Man"), ch("pokemon", "Team Rocket"), ch("hp", "Lord Voldemort"), ch("shows", "Stormtrooper Legion"), ch("westeros", "The Night King")] },
    ];
    const verdict = {
      winner: "Grace", mvp: "Thanos", verdict: "Test.", turning_point: "The snap.", preps: [{ stance: "attack" }, { stance: "defend" }], attacker: "Grace", feature: "wall", defences: "the wall",
      beats: [
        { actor: "Harry Potter", action: "summon_companion", move: "Expecto Patronum", target: "Lord Voldemort", effect: "light", outcome: "hit", death: "normal", caption: "A silver stag charges.", line: "Expecto Patronum!" },
        { actor: "Batman", action: "summon_companion", move: "Batmobile", target: "Stormtrooper Legion", effect: "impact", outcome: "hit", death: "normal", caption: "The Batmobile ploughs in.", line: "" },
        { actor: "Gru", action: "summon_companion", move: "Minions", target: "Team Rocket", effect: "impact", outcome: "ko", death: "blast_off", caption: "Team Rocket's blasting off again!", line: "" },
        { actor: "Elsa", action: "summon_companion", move: "Marshmallow", target: "The Night King", effect: "ice", outcome: "ko", death: "shatter", caption: "Marshmallow smashes the Night King to pieces.", line: "" },
        { actor: "Thanos", action: "special", move: "The Snap", target: "Spider-Man", also: ["Stormtrooper Legion"], effect: "psychic", outcome: "ko", death: "disintegrate", caption: "Thanos snaps.", line: "I don't feel so good." },
        { actor: "Harry Potter", action: "cast", move: "Fiendfyre", target: "Lord Voldemort", effect: "fire", outcome: "ko", death: "burn", caption: "Fiendfyre.", line: "" },
      ],
    };
    if (location.search.includes("real")) {
      fetch("test-verdict.json").then(r => r.json()).then(d => {
        window.fightCtl = Battle.player(document.getElementById("stage"), { teams: d.teams, verdict: d.v, arena: d.arena }, { onEnd: () => { document.title = "ended"; } });
      });
    } else window.fightCtl = Battle.player(document.getElementById("stage"), { teams, verdict, arena: { name: "The Wall", terrain: "A cliff of ice", world: "westeros" } }, {
      onEnd: () => { document.title = "ended"; },
    });
  </script>
</body>
</html>
