<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Battle test</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
  <script>document.write('<link rel="stylesheet" href="battle.css?t=' + Date.now() + '" />')</script>
  <style>
    :root { --paper: #fbf7ef; --ink: #241f1a; }
    body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font: 14px system-ui, sans-serif; }
    #stage { max-width: 960px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script>document.write('<script src="characters.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="sprites.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="sprite.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="battle.js?t=' + Date.now() + '"><\/script>')</script>
  <script>
    const U = window.UNIVERSES;
    const ch = (world, name) => ({ world, name, note: (U[world].characters.find(c => c[0] === name) || [])[1] || "" });
    const teams = [
      { name: "Grace", roster: [ch("westeros", "Daenerys Targaryen"), ch("anime", "Yugi Muto"), ch("westeros", "The Night King"), ch("pokemon", "Jigglypuff"), ch("smash", "Kirby")] },
      { name: "Sam", roster: [ch("shows", "Elsa"), ch("shows", "Rick Sanchez"), ch("shows", "Wile E. Coyote"), ch("famous", "ANZAC Forces"), ch("westeros", "Dothraki Horde")] },
    ];
    const verdict = {
      winner: "Grace", mvp: "Yugi Muto", verdict: "Exodia ended it.", turning_point: "Yugi assembles Exodia.", preps: [],
      beats: [
        { actor: "Elsa", action: "freeze", move: "Let it go", target: "Kirby", effect: "ice", outcome: "hit", caption: "Elsa locks Kirby in ice.", line: "" },
        { actor: "Daenerys Targaryen", action: "summon_dragon", move: "Dracarys", target: "Dothraki Horde", effect: "fire", outcome: "ko", caption: "Drogon answers his mother's call.", line: "Dracarys!" },
        { actor: "The Night King", action: "raise_dead", move: "Rise", target: "ANZAC Forces", effect: "ice", outcome: "hit", caption: "The burned horde rises again, blue-eyed.", line: "" },
        { actor: "ANZAC Forces", action: "airstrike", move: "Close air support", target: "The Night King", effect: "explosion", outcome: "hit", caption: "Bombers roar over the field.", line: "" },
        { actor: "Rick Sanchez", action: "portal", move: "Portal gun", target: "Jigglypuff", effect: "tech", outcome: "hit", caption: "Rick drops Jigglypuff through a portal.", line: "Wubba lubba dub dub!" },
        { actor: "Jigglypuff", action: "lullaby", move: "Sing", target: "Rick Sanchez", effect: "psychic", outcome: "hit", caption: "Jigglypuff sings Rick to sleep.", line: "Jiggly…" },
        { actor: "Wile E. Coyote", action: "anvil", move: "ACME anvil", target: "Daenerys Targaryen", effect: "impact", outcome: "hurt", caption: "An ACME anvil falls from nowhere.", line: "" },
        { actor: "Kirby", action: "devour", move: "Inhale", target: "Wile E. Coyote", effect: "none", outcome: "ko", caption: "Kirby inhales the coyote whole.", line: "Poyo!" },
        { actor: "Elsa", action: "petrify", move: "Frozen heart", target: "The Night King", effect: "ice", outcome: "hit", caption: "Elsa's curse turns the Night King to stone, briefly.", line: "" },
        { actor: "Yugi Muto", action: "summon_giant", move: "Exodia, Obliterate!", target: "ANZAC Forces", effect: "light", outcome: "ko", caption: "All five pieces: Exodia rises.", line: "Exodia, obliterate!" },
        { actor: "Daenerys Targaryen", action: "meteor", move: "Fire from the sky", target: "Elsa", effect: "fire", outcome: "ko", caption: "Fire falls from the sky on Elsa.", line: "" },
      ],
    };
    if (location.search.includes("real")) {
      fetch("test-verdict.json").then(r => r.json()).then(d => {
        window.fightCtl = Battle.player(document.getElementById("stage"), { teams: d.teams, verdict: d.v, arena: d.arena }, { onEnd: () => { document.title = "ended"; } });
      });
    } else window.fightCtl = Battle.player(document.getElementById("stage"), { teams, verdict, arena: { name: "The Wall", terrain: "A cliff of ice", world: "westeros" } }, {
      onEnd: () => { document.title = "ended"; },
    });
  </script>
</body>
</html>
