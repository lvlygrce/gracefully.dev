<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Battle test</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
  <script>document.write('<link rel="stylesheet" href="battle.css?t=' + Date.now() + '" />')</script>
  <style>
    :root { --paper: #fbf7ef; --ink: #241f1a; }
    body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font: 14px system-ui, sans-serif; }
    #stage { max-width: 960px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <!-- Test page only: keep drawing even when this tab is hidden. -->
  <script>window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 30); window.cancelAnimationFrame = id => clearTimeout(id);</script>
  <script>document.write('<script src="characters.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="sprites.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="sprite.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="battle.js?t=' + Date.now() + '"><\/script>')</script>
  <script>
    const U = window.UNIVERSES;
    const ch = (world, name) => ({ world, name, note: (U[world].characters.find(c => c[0] === name) || [])[1] || "" });
    const teams = [
      { name: "Grace", roster: [ch("league", "Annie"), ch("anime", "Yugi Muto"), ch("anime", "Naruto Uzumaki"), ch("anime", "Jotaro Kujo"), ch("shows", "Gandalf")] },
      { name: "Sam", roster: [ch("anime", "Dio Brando"), ch("league", "Malzahar"), ch("league", "Elise"), ch("marvel", "Spider-Man"), ch("hp", "Rubeus Hagrid")] },
    ];
    const verdict = {
      winner: "Grace", mvp: "Yugi Muto", verdict: "Test.", turning_point: "Blue-Eyes.", preps: [],
      beats: [
        { actor: "Annie", action: "summon_companion", move: "Tibbers", target: "Elise", effect: "fire", outcome: "hit", caption: "Annie: Have you seen my bear Tibbers?", line: "Tibbers!" },
        { actor: "Malzahar", action: "summon_companion", move: "Voidlings", target: "Annie", effect: "dark", outcome: "hit", caption: "Voidlings swarm Annie.", line: "" },
        { actor: "Yugi Muto", action: "summon_companion", move: "Blue-Eyes White Dragon", target: "Malzahar", effect: "light", outcome: "ko", caption: "Yugi summons the Blue-Eyes White Dragon.", line: "" },
        { actor: "Dio Brando", action: "summon_companion", move: "The World", target: "Jotaro Kujo", effect: "impact", outcome: "hit", caption: "The World: muda muda muda.", line: "" },
        { actor: "Jotaro Kujo", action: "summon_companion", move: "Star Platinum", target: "Dio Brando", effect: "impact", outcome: "ko", caption: "Star Platinum: ora ora ora.", line: "Ora!" },
        { actor: "Naruto Uzumaki", action: "summon_companion", move: "Kurama", target: "Elise", effect: "fire", outcome: "ko", caption: "Kurama's Tailed Beast Bomb.", line: "" },
        { actor: "Rubeus Hagrid", action: "summon_companion", move: "Aragog", target: "Gandalf", effect: "poison", outcome: "hurt", caption: "Aragog scuttles in.", line: "" },
        { actor: "Gandalf", action: "summon_companion", move: "The Eagles", target: "Rubeus Hagrid", effect: "wind", outcome: "ko", caption: "The eagles are coming.", line: "" },
        { actor: "Yugi Muto", action: "summon_companion", move: "Dark Magician", target: "Spider-Man", effect: "dark", outcome: "ko", caption: "Dark Magic Attack.", line: "" },
      ],
    };
    if (location.search.includes("real")) {
      fetch("test-verdict.json").then(r => r.json()).then(d => {
        window.fightCtl = Battle.player(document.getElementById("stage"), { teams: d.teams, verdict: d.v, arena: d.arena }, { onEnd: () => { document.title = "ended"; } });
      });
    } else window.fightCtl = Battle.player(document.getElementById("stage"), { teams, verdict, arena: { name: "The Wall", terrain: "A cliff of ice", world: "westeros" } }, {
      onEnd: () => { document.title = "ended"; },
    });
  </script>
</body>
</html>
