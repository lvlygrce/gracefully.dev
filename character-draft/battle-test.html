<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Battle test</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
  <script>document.write('<link rel="stylesheet" href="battle.css?t=' + Date.now() + '" />')</script>
  <style>
    :root { --paper: #fbf7ef; --ink: #241f1a; }
    body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font: 14px system-ui, sans-serif; }
    #stage { max-width: 960px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="characters.js?v=26"></script>
  <script>document.write('<script src="sprites.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="sprite.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="battle.js?t=' + Date.now() + '"><\/script>')</script>
  <script>
    const U = window.UNIVERSES;
    const ch = (world, name) => ({ world, name, note: (U[world].characters.find(c => c[0] === name) || [])[1] || "" });
    const teams = [
      { name: "Grace", roster: [ch("marvel", "Thor"), ch("pokemon", "Pikachu"), ch("westeros", "Jon Snow"), ch("hp", "Harry Potter"), ch("minecraft", "Steve")] },
      { name: "Sam", roster: [ch("westeros", "Drogon"), ch("pokemon", "Gengar"), ch("marvel", "Spider-Man"), ch("hp", "Nagini"), ch("minecraft", "Creeper")] },
    ];
    const verdict = {
      winner: "Grace", mvp: "Thor", verdict: "Thor's storm and Steve's sword carried a fight to the death.",
      turning_point: "Thor calls down the storm on Drogon.",
      preps: [
        { gear: [{ name: "Diamond Sword", made_by: "Steve", effect: "a sharper blade", look: "blade", colour: "cyan" }] },
        { gear: [{ name: "TNT bundle", made_by: "scavenged", effect: "explodes", look: "bomb", colour: "red" }] },
      ],
      beats: [
        { actor: "Spider-Man", action: "foresee", move: "Spider-sense", target: "Jon Snow", effect: "impact", outcome: "hit", caption: "Spider-Man's spider-sense tingles; he slips Jon's swing and hits back.", line: "Saw that coming!" },
        { actor: "Gengar", action: "mind_control", move: "Hypnosis", target: "Harry Potter", effect: "psychic", outcome: "hit", caption: "Gengar hypnotises Harry, who turns his wand on Jon.", line: "" },
        { actor: "Thor", action: "fly", move: "Storm flight", target: "Gengar", effect: "lightning", outcome: "ko", caption: "Thor rises on the storm and strikes Gengar from above.", line: "" },
        { actor: "Creeper", action: "clone", move: "Swarm", target: "Steve", effect: "explosion", outcome: "hit", caption: "Three Creepers close in on Steve.", line: "" },
        { actor: "Steve", action: "shrink", move: "Sneak", target: "Creeper", effect: "slash", outcome: "ko", caption: "Steve crouches low and slips under the blast.", line: "" },
        { actor: "Nagini", action: "shapeshift", move: "Maledictus", target: "Pikachu", effect: "poison", outcome: "hit", caption: "Nagini takes Pikachu's shape and strikes.", line: "" },
        { actor: "Pikachu", action: "reality_warp", move: "Thunder Wave", target: "Nagini", effect: "lightning", outcome: "ko", caption: "The air itself bends around Nagini.", line: "Pika!" },
        { actor: "Drogon", action: "grow", move: "Full wingspan", target: "Jon Snow", effect: "fire", outcome: "ko", caption: "Drogon looms huge and crushes Jon.", line: "" },
        { actor: "Thor", action: "regenerate", move: "Asgardian vigour", target: "none", effect: "heal", outcome: "none", caption: "Thor shrugs off his wounds.", line: "" },
        { actor: "Thor", action: "time_stop", move: "Bifrost", target: "Drogon", effect: "lightning", outcome: "ko", caption: "For a heartbeat the world stands still.", line: "" },
        { actor: "Harry Potter", action: "phase", move: "Apparate", target: "Spider-Man", effect: "light", outcome: "ko", caption: "Harry apparates through the smoke and ends it.", line: "" },
      ],
    };
    if (location.search.includes("real")) {
      fetch("test-verdict.json").then(r => r.json()).then(d => {
        window.fightCtl = Battle.player(document.getElementById("stage"), { teams: d.teams, verdict: d.v, arena: d.arena }, { onEnd: () => { document.title = "ended"; } });
      });
    } else window.fightCtl = Battle.player(document.getElementById("stage"), { teams, verdict, arena: { name: "The Wall", terrain: "A cliff of ice", world: "westeros" } }, {
      onEnd: () => { document.title = "ended"; },
    });
  </script>
</body>
</html>
