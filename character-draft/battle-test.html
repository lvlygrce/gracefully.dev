<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Battle test</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
  <script>document.write('<link rel="stylesheet" href="battle.css?t=' + Date.now() + '" />')</script>
  <style>
    :root { --paper: #fbf7ef; --ink: #241f1a; }
    body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font: 14px system-ui, sans-serif; }
    #stage { max-width: 960px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="characters.js?v=26"></script>
  <script>document.write('<script src="sprites.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="sprite.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="battle.js?t=' + Date.now() + '"><\/script>')</script>
  <script>
    const U = window.UNIVERSES;
    const ch = (world, name) => ({ world, name, note: (U[world].characters.find(c => c[0] === name) || [])[1] || "" });
    const teams = [
      { name: "Grace", roster: [ch("marvel", "Thor"), ch("pokemon", "Pikachu"), ch("westeros", "Jon Snow"), ch("hp", "Harry Potter"), ch("minecraft", "Steve")] },
      { name: "Sam", roster: [ch("westeros", "Drogon"), ch("pokemon", "Gengar"), ch("marvel", "Spider-Man"), ch("hp", "Nagini"), ch("minecraft", "Creeper")] },
    ];
    const verdict = {
      winner: "Grace", mvp: "Thor", verdict: "Thor's storm and Steve's sword carried a fight to the death.",
      turning_point: "Thor calls down the storm on Drogon.",
      preps: [
        { gear: [{ name: "Diamond Sword", made_by: "Steve", effect: "a sharper blade", look: "blade", colour: "cyan" }] },
        { gear: [{ name: "TNT bundle", made_by: "scavenged", effect: "explodes", look: "bomb", colour: "red" }] },
      ],
      beats: [
        { actor: "Spider-Man", action: "combo", move: "Web-swing kick", target: "Jon Snow", effect: "impact", outcome: "hit", caption: "Spider-Man swings in with a flurry of kicks.", line: "Thwip!" },
        { actor: "Thor", action: "throw", move: "Mjölnir throw", target: "Spider-Man", effect: "lightning", outcome: "crit", caption: "Thor hurls Mjölnir, and it comes back.", line: "" },
        { actor: "Gengar", action: "teleport", move: "Shadow Sneak", target: "Pikachu", effect: "dark", outcome: "hit", caption: "Gengar melts into the shadows and strikes from behind.", line: "" },
        { actor: "Pikachu", action: "barrage", move: "Thunder", target: "Gengar", effect: "lightning", outcome: "ko", caption: "Pikachu brings down a storm of bolts on Gengar.", line: "Pika!" },
        { actor: "Steve", action: "strike", move: "Diamond Sword", target: "Creeper", gear: "Diamond Sword", effect: "slash", outcome: "ko", caption: "Steve draws his new diamond sword and cuts the Creeper down.", line: "" },
        { actor: "Nagini", action: "grab", move: "Constrict", target: "Harry Potter", effect: "poison", outcome: "hit", caption: "Nagini coils around Harry and hurls him.", line: "" },
        { actor: "Harry Potter", action: "cast", move: "Sectumsempra", target: "Nagini", effect: "blood", outcome: "ko", caption: "Harry's curse cuts Nagini apart.", line: "Sectumsempra!" },
        { actor: "Drogon", action: "slam", move: "Dive bomb", target: "Thor", effect: "fire", outcome: "hit", caption: "Drogon crashes down, scattering the line.", line: "" },
        { actor: "Thor", action: "transform", move: "God of Thunder", target: "none", effect: "lightning", outcome: "none", caption: "Thor's eyes blaze as the storm fills him.", line: "Bring me Thanos!" },
        { actor: "Thor", action: "annihilate", move: "Bifrost storm", target: "none", effect: "lightning", outcome: "ko", caption: "Thor unleashes the storm on everyone left.", line: "" },
      ],
    };
    if (location.search.includes("real")) {
      fetch("test-verdict.json").then(r => r.json()).then(d => {
        window.fightCtl = Battle.player(document.getElementById("stage"), { teams: d.teams, verdict: d.v, arena: d.arena }, { onEnd: () => { document.title = "ended"; } });
      });
    } else window.fightCtl = Battle.player(document.getElementById("stage"), { teams, verdict, arena: { name: "The Wall", terrain: "A cliff of ice", world: "westeros" } }, {
      onEnd: () => { document.title = "ended"; },
    });
  </script>
</body>
</html>
