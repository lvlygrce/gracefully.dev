<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Battle test</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
  <script>document.write('<link rel="stylesheet" href="battle.css?t=' + Date.now() + '" />')</script>
  <style>
    :root { --paper: #fbf7ef; --ink: #241f1a; }
    body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font: 14px system-ui, sans-serif; }
    #stage { max-width: 960px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <!-- Test page only: keep drawing even when this tab is hidden. -->
  <script>window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 30); window.cancelAnimationFrame = id => clearTimeout(id);</script>
  <script>document.write('<script src="characters.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="sprites.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="sprite.js?t=' + Date.now() + '"><\/script>')</script>
  <script>document.write('<script src="battle.js?t=' + Date.now() + '"><\/script>')</script>
  <script>
    const U = window.UNIVERSES;
    const ch = (world, name) => ({ world, name, note: (U[world].characters.find(c => c[0] === name) || [])[1] || "" });
    const teams = [
      { name: "Grace", roster: [ch("dc", "Superman"), ch("dc", "Black Canary"), ch("marvel", "Storm"), ch("anime", "Shigeo Kageyama"), ch("smash", "Sonic")] },
      { name: "Sam", roster: [ch("anime", "Monkey D. Luffy"), ch("marvel", "Rogue"), ch("minecraft", "Creeper"), ch("mha", "Eri"), ch("anime", "Frieza")] },
    ];
    const verdict = {
      winner: "Grace", mvp: "Superman", verdict: "Test.", turning_point: "Mob lifts Frieza.", preps: [],
      beats: [
        { actor: "Black Canary", action: "shout", move: "Canary Cry", target: "Luffy", effect: "wind", outcome: "hit", caption: "Canary Cry.", line: "" },
        { actor: "Monkey D. Luffy", action: "stretch", move: "Gum-Gum Pistol", target: "Sonic", effect: "impact", outcome: "hit", caption: "Gum-Gum Pistol!", line: "" },
        { actor: "Sonic", action: "spin_dash", move: "Spin Dash", target: "Rogue", effect: "impact", outcome: "hit", caption: "Sonic spin-dashes.", line: "" },
        { actor: "Rogue", action: "drain", move: "Absorb", target: "Superman", effect: "psychic", outcome: "hurt", caption: "Rogue drains Superman.", line: "" },
        { actor: "Superman", action: "laser_eyes", move: "Heat Vision", target: "Rogue", effect: "fire", outcome: "ko", caption: "Heat vision.", line: "" },
        { actor: "Eri", action: "time_rewind", move: "Rewind", target: "none", effect: "none", outcome: "none", caption: "Eri turns back time.", line: "" },
        { actor: "Storm", action: "lightning_storm", move: "Storm", target: "Frieza", effect: "lightning", outcome: "hit", caption: "Storm calls lightning.", line: "" },
        { actor: "Frieza", action: "black_hole", move: "Supernova", target: "Storm", effect: "dark", outcome: "hit", caption: "A black hole opens.", line: "" },
        { actor: "Storm", action: "tornado", move: "Tornado", target: "Eri", effect: "wind", outcome: "hit", caption: "A tornado.", line: "" },
        { actor: "Superman", action: "earthquake", move: "Ground stomp", target: "Luffy", effect: "earth", outcome: "ko", caption: "The ground splits.", line: "" },
        { actor: "Creeper", action: "self_destruct", move: "Sssss", target: "Sonic", effect: "explosion", outcome: "hit", caption: "The Creeper explodes.", line: "" },
        { actor: "Shigeo Kageyama", action: "telekinesis", move: "100%", target: "Frieza", effect: "psychic", outcome: "ko", caption: "Mob lifts Frieza.", line: "" },
      ],
    };
    if (location.search.includes("real")) {
      fetch("test-verdict.json").then(r => r.json()).then(d => {
        window.fightCtl = Battle.player(document.getElementById("stage"), { teams: d.teams, verdict: d.v, arena: d.arena }, { onEnd: () => { document.title = "ended"; } });
      });
    } else window.fightCtl = Battle.player(document.getElementById("stage"), { teams, verdict, arena: { name: "The Wall", terrain: "A cliff of ice", world: "westeros" } }, {
      onEnd: () => { document.title = "ended"; },
    });
  </script>
</body>
</html>
