<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gracefully</title>
  <meta name="description" content="A home for gracefully developed apps by Grace Piddington." />

  <meta property="og:title" content="Gracefully" />
  <meta property="og:description" content="A home for gracefully developed apps by Grace Piddington." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://gracefully.dev/" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />

  <style>
    :root {
      --bg: #fbfaf8;
      --fg: #1a1a17;
      --muted: #6b6b63;
      --hair: #e4e2dc;
      --accent: #3a7d5c;
      --card: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141513;
        --fg: #ecebe6;
        --muted: #9a9a90;
        --hair: #2b2c28;
        --accent: #6cc79b;
        --card: #1c1d1a;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 40rem;
      margin: 0 auto;
      padding: clamp(3rem, 12vh, 9rem) 1.5rem 3rem;
    }

    header { margin-bottom: 3.5rem; }

    .wordmark {
      font-size: clamp(2.25rem, 7vw, 3.25rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .wordmark .dot { color: var(--accent); }

    .tagline {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 1.0625rem;
      max-width: 30rem;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--hair);
      margin-bottom: 0.5rem;
    }

    ul.apps { list-style: none; }

    ul.apps li { border-bottom: 1px solid var(--hair); }

    a.app {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.25rem 1rem;
      padding: 1.15rem 0.25rem;
      text-decoration: none;
      color: inherit;
      transition: padding-left 0.15s ease, background 0.15s ease;
    }

    a.app:hover,
    a.app:focus-visible {
      padding-left: 0.75rem;
      background: var(--card);
      outline: none;
    }

    a.app .name {
      font-size: 1.125rem;
      font-weight: 500;
    }

    a.app:hover .name,
    a.app:focus-visible .name { color: var(--accent); }

    a.app .desc {
      color: var(--muted);
      font-size: 0.9375rem;
      flex: 1 1 12rem;
    }

    a.app .arrow {
      color: var(--muted);
      transition: transform 0.15s ease;
    }

    a.app:hover .arrow,
    a.app:focus-visible .arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    .empty {
      padding: 1.5rem 0.25rem;
      color: var(--muted);
      font-size: 0.9375rem;
    }

    footer {
      max-width: 40rem;
      margin: 0 auto;
      width: 100%;
      padding: 2rem 1.5rem 2.5rem;
      border-top: 1px solid var(--hair);
      color: var(--muted);
      font-size: 0.8125rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 class="wordmark">Gracefully<span class="dot">.</span></h1>
      <p class="tagline">A home for gracefully developed apps by Grace Piddington.</p>
    </header>

    <nav aria-label="Apps">
      <div class="section-label">Apps</div>
      <ul class="apps" id="app-list"></ul>
      <p class="empty" id="empty-state" hidden>Nothing here yet &mdash; the first app is on its way.</p>
    </nav>
  </main>

  <footer>
    <span>&copy; <span id="year"></span> Grace Piddington</span>
    <a href="https://github.com/lvlygrce" rel="me">github.com/lvlygrce</a>
  </footer>

  <script>
    // To publish an app, add an entry here and push. Order is preserved.
    //   { name: "App Name", desc: "One-line description.", url: "https://app.gracefully.dev" }
    const apps = [];

    const list = document.getElementById("app-list");
    const empty = document.getElementById("empty-state");

    if (apps.length === 0) {
      empty.hidden = false;
    } else {
      for (const app of apps) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.className = "app";
        a.href = app.url;

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = app.name;

        const desc = document.createElement("span");
        desc.className = "desc";
        desc.textContent = app.desc || "";

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "→";

        a.append(name, desc, arrow);
        li.append(a);
        list.append(li);
      }
    }

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
